name: Daily Quote Release

on:
  schedule:
    # 6am UTC = 9am Nairobi (EAT)
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      date_override:
        description: "Override date (YYYY-MM-DD) — leave empty for today"
        required: false
        default: ""

jobs:
  publish-quote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date_override }}" ]; then
            RESOLVED="${{ github.event.inputs.date_override }}"
          else
            RESOLVED="$(date -u +'%Y-%m-%d')"
          fi
          echo "date=$RESOLVED" >> "$GITHUB_OUTPUT"
          echo "Resolved date: $RESOLVED"

      - name: Extract today's quote
        id: quote
        run: |
          DATE="${{ steps.date.outputs.date }}"
          ENTRY=$(jq --arg date "$DATE" '.[] | select(.date == $date)' upcoming-quotes.json)

          if [ -z "$ENTRY" ]; then
            echo "No quote scheduled for $DATE — exiting."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "found=true" >> "$GITHUB_OUTPUT"

          TAGS=$(echo "$ENTRY" | jq -r '.tags')
          QUOTE=$(echo "$ENTRY" | jq -r '.quote')
          AUTHOR=$(echo "$ENTRY" | jq -r '.author')

          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "quote=$QUOTE" >> "$GITHUB_OUTPUT"
          echo "author=$AUTHOR" >> "$GITHUB_OUTPUT"

          echo "Quote found: $AUTHOR — $QUOTE"

      - name: Append to year archive
        if: steps.quote.outputs.found == 'true'
        run: |
          TAGS="${{ steps.quote.outputs.tags }}"
          QUOTE="${{ steps.quote.outputs.quote }}"
          AUTHOR="${{ steps.quote.outputs.author }}"
          DATE="${{ steps.date.outputs.date }}"

          # Convert 2026-07-04 → July 4 2026
          MONTH=$(date -d "$DATE" +'%B')
          DAY=$(date -d "$DATE" +'%-d')
          YEAR=$(date -d "$DATE" +'%Y')
          HEADLINE="# ${TAGS} Wisdom of the Day (${MONTH} ${DAY} ${YEAR})"

          ARCHIVE="${YEAR}/${YEAR}.md"

          # Create the year archive with a header if it doesn't exist yet
          if [ ! -f "$ARCHIVE" ]; then
            mkdir -p "$YEAR"
            cat > "$ARCHIVE" <<EOF
          <div align="center">

          # 📜 Wisdom-Drop · ${YEAR} Archive

          **The ${YEAR} edition — daily quotes from January through December ${YEAR}**

          </div>

          <p align="center">
            <a href="#"><img src="https://img.shields.io/badge/year-${YEAR}-8b9dc3?style=flat" alt="Year ${YEAR}"></a>
            <a href="#"><img src="https://img.shields.io/badge/quotes%20published-1-2d4b3e?style=flat" alt="Quotes Published"></a>
            <a href="../README.md"><img src="https://img.shields.io/badge/main%20README-→-5a7d6e?style=flat" alt="Main README"></a>
          </p>

          > **This is the ${YEAR} archive of [Wisdom-Drop](../README.md)** — the daily-quote anthology continuing the practice begun in July 2025. Quotes are published daily and live here.

          ---

          # 📚 ${YEAR} Quote Archive

          ### Q1 ${YEAR} (January – March)
          EOF
            echo "Created new archive: $ARCHIVE"
          fi

          {
            echo ""
            echo "$HEADLINE"
            echo "> \"${QUOTE}\""
            echo "> — ${AUTHOR}"
          } >> "$ARCHIVE"

          echo "Appended to $ARCHIVE: $HEADLINE"

      - name: Update README today's quote
        if: steps.quote.outputs.found == 'true'
        run: |
          TAGS="${{ steps.quote.outputs.tags }}"
          QUOTE="${{ steps.quote.outputs.quote }}"
          AUTHOR="${{ steps.quote.outputs.author }}"
          DATE="${{ steps.date.outputs.date }}"

          MONTH=$(date -d "$DATE" +'%B')
          DAY=$(date -d "$DATE" +'%-d')
          YEAR=$(date -d "$DATE" +'%Y')

          # Write the today's-quote block (between the stable markers) to a temp file
          {
            echo "<!-- today-quote-start -->"
            echo ""
            echo "### * Today's Quote — ${MONTH} ${DAY}, ${YEAR}"
            echo ""
            echo "<table>"
            echo "<tr><td>"
            echo ""
            echo "> \"${QUOTE}\""
            echo "> — ${AUTHOR}"
            echo ""
            echo "</td></tr>"
            echo "</table>"
            echo ""
            echo "<p align=\"right\"><sub>Tags: ${TAGS}</sub></p>"
            echo ""
            echo "<!-- today-quote-end -->"
          } > /tmp/today-block.md

          # Replace the region between the start/end markers with the block from the temp file
          awk '
            /<!-- today-quote-start -->/ { skip = 1; next }
            /<!-- today-quote-end -->/ {
              while ((getline line < "/tmp/today-block.md") > 0) print line
              skip = 0
              next
            }
            !skip { print }
          ' README.md > README.tmp && mv README.tmp README.md

          echo "Updated README.md today's quote section"

      - name: Remove published entry from JSON
        if: steps.quote.outputs.found == 'true'
        run: |
          DATE="${{ steps.date.outputs.date }}"
          jq --arg date "$DATE" 'map(select(.date != $date))' upcoming-quotes.json > tmp.json
          mv tmp.json upcoming-quotes.json
          echo "Removed $DATE from upcoming-quotes.json ($(jq length upcoming-quotes.json) remaining)"

      - name: Refresh counts
        if: steps.quote.outputs.found == 'true'
        run: |
          PUBLISHED=$(grep -rhc 'Wisdom of the Day' 20*/*.md 2>/dev/null | awk '{s+=$1} END {print s+0}')
          QUEUED=$(jq 'length' upcoming-quotes.json)

          echo "Published: $PUBLISHED, Queued: $QUEUED"

          sed -i -E "s/quotes%20published-[0-9]+/quotes%20published-$PUBLISHED/g" README.md
          sed -i -E "s/quotes%20queued-[0-9]+/quotes%20queued-$QUEUED/g" README.md
          sed -i -E "s/[0-9]+ quotes published so far/$PUBLISHED quotes published so far/g" README.md
          sed -i -E "s/[0-9]+ more queued and counting/$QUEUED more queued and counting/g" README.md
          sed -i -E "s/[0-9]+ quotes scheduled ahead/$QUEUED quotes scheduled ahead/g" README.md

          # Keep each year archive's "quotes published" badge in sync with its own file
          for f in 20*/*.md; do
            n=$(grep -c 'Wisdom of the Day' "$f" || true)
            sed -i -E "s/quotes%20published-[0-9]+/quotes%20published-$n/" "$f"
            echo "Year badge: $f -> $n published"
          done

      - name: Commit and push
        if: steps.quote.outputs.found == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add 20*/*.md README.md upcoming-quotes.json
          git commit -m "Daily quote: ${{ steps.date.outputs.date }} — ${{ steps.quote.outputs.author }}

          Co-authored-by: DeepSeek V4 Pro <agent@atlarix.dev>"
          git push
